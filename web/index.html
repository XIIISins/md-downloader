<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MangaDex Library</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1a1a1f; --card: #f1f1f4; --muted: #6b6b76;
    --accent: #e8590c; --line: #d9d9e0; --chip: #e1e1e8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141417; --fg: #ececf0; --card: #202026; --muted: #9a9aa6; --line: #34343d; --chip: #2e2e36; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  header {
    position: sticky; top: 0; z-index: 2; background: var(--bg);
    border-bottom: 1px solid var(--line);
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 16px;
  }
  header h1 { font-size: 16px; margin: 0 auto 0 0; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .btn { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }

  .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; width: 100%; }
  .filters input, .filters select {
    font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 10px;
  }
  .filters input { min-width: 200px; }
  .yr { color: var(--muted); white-space: nowrap; }
  .filters .yr input { min-width: 0; width: 80px; }
  .active-tag { background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 2px 10px; font-size: 12px; }
  .active-tag.ex { background: #c92a2a; }
  .tag.ex { background: #c92a2a; color: #fff; text-decoration: line-through; }
  .meta { font-size: 13px; color: var(--muted); text-transform: capitalize; }
  .tag { cursor: pointer; }
  .tag:hover { outline: 1px solid var(--accent); }
  .tag.on { background: var(--accent); color: #fff; }
  .row[hidden] { display: none; }
  #list { display: flex; flex-direction: column; gap: 14px; padding: 16px; max-width: 1200px; margin: 0 auto; }
  .row {
    display: grid; grid-template-columns: 150px 1fr auto; gap: 16px;
    background: var(--card); border-radius: 8px; padding: 14px; min-height: 240px;
  }
  .row img { width: 150px; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 4px; background: var(--line); display: block; }
  .main { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .name { font-size: 18px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { background: var(--chip); border-radius: 4px; padding: 1px 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; }
  .desc { white-space: pre-line; overflow-wrap: anywhere; font-size: 14px; max-height: 11.5em; overflow: hidden; cursor: pointer; position: relative; }
  .desc.open { max-height: none; }
  .desc.long:not(.open)::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3em;
    background: linear-gradient(transparent, var(--card));
  }
  .side { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; min-width: 150px; }
  .stats { display: flex; gap: 12px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .status { font-size: 13px; }
  .status::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .status.ongoing::before { background: #37b24d; }
  .status.completed::before { background: #4c6ef5; }
  .status.hiatus::before { background: #f59f00; }
  .status.cancelled::before { background: #e03131; }
  .yn { display: flex; margin-top: auto; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .yn button { width: 56px; padding: 8px 0; border: 0; background: transparent; }
  .yn button + button { border-left: 1px solid var(--line); }
  .yn button.on-y { background: var(--accent); color: #fff; }
  .yn button.on-n { background: var(--line); }
  .badge { font-size: 12px; padding: 2px 10px; border-radius: 10px; background: #0009; color: #fff; }
  .badge.done { background: #2b8a3e; }
  .badge.failed { background: #c92a2a; }
  .badge.queued { background: #1971c2; }
  .badge.running { background: var(--accent); }
  .badge.canceled { background: #6b6b76; }
  .row.locked .yn { opacity: .35; pointer-events: none; }
  .cancel { font-size: 12px; padding: 2px 10px; border-radius: 10px; border: 1px solid var(--line); background: transparent; }
  .cancel:hover { border-color: #c92a2a; color: #c92a2a; }
  #banner { margin: 12px 16px 0; padding: 10px 14px; border-radius: 6px; background: #c92a2a; color: #fff; font-size: 14px; }
  #banner[hidden] { display: none; }
  .detail { font-size: 11px; color: var(--muted); text-align: right; overflow-wrap: anywhere; max-width: 220px; }
  #log {
    margin: 0 auto 16px; max-width: 1168px; padding: 10px; background: var(--card); border-radius: 6px;
    font: 12px/1.5 ui-monospace, monospace; max-height: 180px; overflow: auto; white-space: pre-wrap; display: none;
  }
  #msg { padding: 16px; color: var(--muted); text-align: center; }

  @media (max-width: 640px) {
    .row { grid-template-columns: 100px 1fr; }
    .row img { width: 100px; }
    .side { grid-column: 1 / -1; flex-direction: row; align-items: center; flex-wrap: wrap; justify-content: space-between; }
    .yn { margin-top: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>MangaDex Library <span id="count" style="color:var(--muted)"></span></h1>
  <button class="btn" id="allY">All Y</button>
  <button class="btn" id="allN">All N</button>
  <button class="btn" id="clearDone" title="Remove finished, failed and canceled entries from the queue">Clear finished</button>
  <button class="btn primary" id="go" disabled>Queue</button>
  <div class="filters">
    <input id="q" type="search" placeholder="Search title...">
    <select id="tagSel"><option value="">Include tag...</option></select>
    <select id="exSel"><option value="">Exclude tag...</option></select>
    <select id="demoSel"><option value="">Any demographic</option></select>
    <span class="yr">Year
      <input id="yFrom" type="number" min="1900" max="2100" placeholder="from">
      &ndash;
      <input id="yTo" type="number" min="1900" max="2100" placeholder="to">
    </span>
    <select id="sortSel" title="Sort by">
      <option value="title">Sort: Title A&ndash;Z</option>
      <option value="titleDesc">Sort: Title Z&ndash;A</option>
      <option value="rating">Sort: Rating (high first)</option>
      <option value="follows">Sort: Follows (high first)</option>
      <option value="yearNew">Sort: Year (newest first)</option>
      <option value="yearOld">Sort: Year (oldest first)</option>
    </select>
    <span id="activeTags"></span>
    <button class="btn" id="clearTags" hidden>Clear tags</button>
    <span id="shown" style="color:var(--muted)"></span>
  </div>
</header>
<div id="banner" hidden></div>
<div id="msg">Loading...</div>
<div id="list"></div>
<pre id="log"></pre>

<script>
  const list = document.getElementById('list');
  const goBtn = document.getElementById('go');
  const logEl = document.getElementById('log');
  const msg = document.getElementById('msg');
  const selected = new Set();
  const rows = {};
  const activeTags = new Set();
  const excludedTags = new Set();
  const jobs = {}; // manga id -> job from the downloader's queue
  let allItems = [];

  // A series that is queued or running can't be queued again.
  function locked(id) {
    const j = jobs[id];
    return !!j && (j.state === 'queued' || j.state === 'running');
  }

  const FLAGS = { ko: '\u{1F1F0}\u{1F1F7}', ja: '\u{1F1EF}\u{1F1F5}', zh: '\u{1F1E8}\u{1F1F3}',
                  'zh-hk': '\u{1F1ED}\u{1F1F0}', en: '\u{1F1EC}\u{1F1E7}' };

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function refresh() {
    document.getElementById('count').textContent = selected.size + ' selected';
    goBtn.disabled = selected.size === 0;
    goBtn.textContent = 'Queue ' + selected.size;
    for (const [id, r] of Object.entries(rows)) {
      const yes = selected.has(id);
      r.y.className = yes ? 'on-y' : '';
      r.n.className = yes ? '' : 'on-n';
      r.el.classList.toggle('locked', locked(id));
      r.cancel.hidden = !locked(id);
    }
  }

  function set(id, yes) {
    if (yes && !locked(id)) selected.add(id); else selected.delete(id);
    refresh();
  }

  function row(item) {
    const r = el('div', 'row');

    const img = el('img');
    img.loading = 'lazy';
    img.alt = '';
    img.src = '/cover/' + item.id;
    r.appendChild(img);

    const main = el('div', 'main');
    main.appendChild(el('div', 'name', (FLAGS[item.lang] || item.lang || '') + ' ' + item.title));
    if (item.tags && item.tags.length) {
      const tags = el('div', 'tags');
      for (const t of item.tags) {
        const chip = el('span', 'tag', t);
        chip.title = 'Click: include ' + t + ' / Shift-click: exclude';
        chip.onclick = (e) => e.shiftKey ? toggleExcluded(t) : toggleTag(t);
        tags.appendChild(chip);
      }
      main.appendChild(tags);
    }
    const desc = el('div', 'desc', item.description || 'No summary.');
    if ((item.description || '').length > 450) desc.classList.add('long');
    desc.onclick = () => desc.classList.toggle('open');
    main.appendChild(desc);
    r.appendChild(main);

    const side = el('div', 'side');
    const stats = el('div', 'stats');
    if (item.rating) stats.appendChild(el('span', '', '★ ' + item.rating.toFixed(2)));
    if (item.follows) stats.appendChild(el('span', '', '\u{1F516} ' + item.follows.toLocaleString()));
    side.appendChild(stats);
    if (item.status) side.appendChild(el('div', 'status ' + item.status, item.status));
    const meta = [item.year ? 'Since ' + item.year : '', item.demographic].filter(Boolean).join(' · ');
    if (meta) side.appendChild(el('div', 'meta', meta));

    const badge = el('span', 'badge');
    badge.hidden = true;
    const detail = el('div', 'detail');
    const cancel = el('button', 'cancel', 'Cancel');
    cancel.hidden = true;
    cancel.onclick = () => post('/api/cancel/' + item.id);
    side.append(badge, detail, cancel);

    const yn = el('div', 'yn');
    const y = el('button', '', 'Y');
    const n = el('button', '', 'N');
    y.onclick = () => set(item.id, true);
    n.onclick = () => set(item.id, false);
    yn.append(y, n);
    side.appendChild(yn);
    r.appendChild(side);

    rows[item.id] = { el: r, item, y, n, badge, detail, cancel };
    return r;
  }

  // A tag is either included, excluded, or neither, never both.
  function toggleTag(t) {
    excludedTags.delete(t);
    if (activeTags.has(t)) activeTags.delete(t); else activeTags.add(t);
    applyFilter();
  }

  function toggleExcluded(t) {
    activeTags.delete(t);
    if (excludedTags.has(t)) excludedTags.delete(t); else excludedTags.add(t);
    applyFilter();
  }

  function visibleIDs() {
    return Object.entries(rows).filter(([, r]) => !r.el.hidden).map(([id]) => id);
  }

  // Rows must match the search text and carry every active tag.
  function applyFilter() {
    const q = document.getElementById('q').value.trim().toLowerCase();
    let shown = 0;
    for (const r of Object.values(rows)) {
      const okText = !q || r.item.title.toLowerCase().includes(q);
      const tags = r.item.tags || [];
      const okTags = [...activeTags].every(t => tags.includes(t));
      const okEx = ![...excludedTags].some(t => tags.includes(t));
      const demo = document.getElementById('demoSel').value;
      const okDemo = !demo || (r.item.demographic || 'none') === demo;
      // Titles with no known year are hidden while a year bound is set.
      const yFrom = parseInt(document.getElementById('yFrom').value, 10);
      const yTo = parseInt(document.getElementById('yTo').value, 10);
      const y = r.item.year || 0;
      const okYear = (isNaN(yFrom) && isNaN(yTo)) ||
        (y > 0 && (isNaN(yFrom) || y >= yFrom) && (isNaN(yTo) || y <= yTo));
      r.el.hidden = !(okText && okTags && okEx && okDemo && okYear);
      if (!r.el.hidden) shown++;
      for (const c of r.el.querySelectorAll('.tag')) {
        c.classList.toggle('on', activeTags.has(c.textContent));
        c.classList.toggle('ex', excludedTags.has(c.textContent));
      }
    }
    document.getElementById('shown').textContent = shown + ' of ' + allItems.length + ' shown';

    const box = document.getElementById('activeTags');
    box.replaceChildren();
    for (const t of activeTags) {
      const b = el('button', 'active-tag', t + ' ×');
      b.onclick = () => toggleTag(t);
      box.appendChild(b);
    }
    for (const t of excludedTags) {
      const b = el('button', 'active-tag ex', '− ' + t + ' ×');
      b.onclick = () => toggleExcluded(t);
      box.appendChild(b);
    }
    document.getElementById('clearTags').hidden = activeTags.size + excludedTags.size === 0;
  }

  // Missing values (0) always sort last, whichever direction is chosen.
  function byNumber(field, dir) {
    return (a, b) => {
      const va = a.item[field] || 0, vb = b.item[field] || 0;
      if (!va && !vb) return a.item.title.localeCompare(b.item.title);
      if (!va) return 1;
      if (!vb) return -1;
      return dir * (va - vb) || a.item.title.localeCompare(b.item.title);
    };
  }

  const SORTS = {
    title: (a, b) => a.item.title.localeCompare(b.item.title),
    titleDesc: (a, b) => b.item.title.localeCompare(a.item.title),
    rating: byNumber('rating', -1),
    follows: byNumber('follows', -1),
    yearNew: byNumber('year', -1),
    yearOld: byNumber('year', 1),
  };

  function applySort() {
    const sorted = Object.values(rows).sort(SORTS[document.getElementById('sortSel').value]);
    for (const r of sorted) list.appendChild(r.el);
  }

  function buildTagSelect(items) {
    const counts = {};
    for (const it of items) for (const t of it.tags || []) counts[t] = (counts[t] || 0) + 1;
    const sel = document.getElementById('tagSel');
    for (const t of Object.keys(counts).sort()) {
      const o = el('option', '', t + ' (' + counts[t] + ')');
      o.value = t;
      sel.appendChild(o);
    }
    const ex = document.getElementById('exSel');
    for (const t of Object.keys(counts).sort()) {
      const o = el('option', '', t + ' (' + counts[t] + ')');
      o.value = t;
      ex.appendChild(o);
    }
    sel.onchange = () => {
      if (sel.value) { excludedTags.delete(sel.value); activeTags.add(sel.value); }
      sel.value = '';
      applyFilter();
    };
    ex.onchange = () => {
      if (ex.value) { activeTags.delete(ex.value); excludedTags.add(ex.value); }
      ex.value = '';
      applyFilter();
    };

    const demoCounts = {};
    for (const it of items) { const d = it.demographic || 'none'; demoCounts[d] = (demoCounts[d] || 0) + 1; }
    const demo = document.getElementById('demoSel');
    for (const d of Object.keys(demoCounts).sort()) {
      const o = el('option', '', d + ' (' + demoCounts[d] + ')');
      o.value = d;
      demo.appendChild(o);
    }
    demo.onchange = applyFilter;
  }

  async function load() {
    const items = await (await fetch('/api/library')).json();
    msg.hidden = items.length > 0;
    if (!items.length) msg.textContent = 'Nothing in this list.';
    allItems = items;
    for (const it of items) list.appendChild(row(it));
    buildTagSelect(items);
    applyFilter();
    refresh();
    poll();
  }

  const banner = document.getElementById('banner');

  function showBanner(text) {
    banner.textContent = text || '';
    banner.hidden = !text;
  }

  async function post(path, body) {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!res.ok) {
      let text = await res.text();
      try { text = JSON.parse(text).error || text; } catch (e) {}
      showBanner(text);
    }
    await pollOnce();
    return res;
  }

  // One round trip to the downloader's queue (through this server).
  async function pollOnce() {
    const res = await fetch('/api/queue');
    const p = await res.json();
    if (!res.ok) { showBanner(p.error || 'Downloader not reachable.'); return; }
    showBanner('');

    for (const id of Object.keys(jobs)) delete jobs[id];
    for (const j of p.jobs || []) jobs[j.id] = j;
    for (const [id, r] of Object.entries(rows)) {
      const j = jobs[id];
      r.badge.hidden = !j;
      if (j) {
        r.badge.textContent = j.state;
        r.badge.className = 'badge ' + j.state;
      }
      r.detail.textContent = j ? j.detail : '';
      if (locked(id)) selected.delete(id);
    }
    if (p.log && p.log.length) {
      logEl.style.display = 'block';
      logEl.textContent = p.log.slice(-40).join('\n');
      logEl.scrollTop = logEl.scrollHeight;
    }
    refresh();
  }

  async function poll() {
    try { await pollOnce(); } catch (e) { return; /* web app stopped; stop quietly */ }
    setTimeout(poll, 1500);
  }

  goBtn.onclick = async () => {
    const ids = [...selected].filter(id => !locked(id));
    if (!ids.length) return;
    const res = await post('/api/download', { ids });
    if (res.ok) {
      const r = await res.clone().json().catch(() => ({}));
      selected.clear();
      if (r.skipped && r.skipped.length) {
        showBanner(r.skipped.length + ' already queued, skipped.');
        setTimeout(() => { if (banner.textContent.endsWith('skipped.')) showBanner(''); }, 4000);
      }
      refresh();
    }
  };
  document.getElementById('clearDone').onclick = () => post('/api/clear');
  // Bulk Y/N only touches the rows currently shown by the filters.
  document.getElementById('allY').onclick = () => { visibleIDs().filter(id => !locked(id)).forEach(id => selected.add(id)); refresh(); };
  document.getElementById('allN').onclick = () => { visibleIDs().forEach(id => selected.delete(id)); refresh(); };
  document.getElementById('q').oninput = applyFilter;
  document.getElementById('yFrom').oninput = applyFilter;
  document.getElementById('yTo').oninput = applyFilter;
  document.getElementById('sortSel').onchange = applySort;
  document.getElementById('clearTags').onclick = () => { activeTags.clear(); excludedTags.clear(); applyFilter(); };

  load();
</script>
</body>
</html>
