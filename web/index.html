<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- The app name: change it here; the header shows the same text. -->
<title>MD Downloader</title>
<link rel="preload" href="/static/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<a class="skip" href="#grid">Skip to titles</a>

<header class="bar">
  <h1></h1>
  <div class="views" role="group" aria-label="Layout">
    <button id="vPosters" type="button" aria-pressed="true" aria-label="Posters" title="Posters"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button>
    <button id="vRows" type="button" aria-pressed="false" aria-label="Rows" title="Rows"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="7" rx="1.5"/><rect x="4" y="13" width="16" height="7" rx="1.5"/></svg></button>
    <button id="vList" type="button" aria-pressed="false" aria-label="List" title="List"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
  </div>
  <button id="queueBtn" class="iconbtn" type="button" aria-label="Queue" aria-haspopup="dialog" aria-expanded="false" aria-controls="queuePanel" title="Queue"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m-5-4 5 5 5-5M5 20h14"/></svg><b id="queueCount" class="cnt" hidden></b></button>
  <button id="settingsBtn" class="iconbtn" type="button" aria-label="Settings" aria-haspopup="dialog" aria-expanded="false" aria-controls="settingsPanel" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h9M18 7h1M5 17h1M10 17h9"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
</header>

<div class="searchrow">
  <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="q" type="search" placeholder="Search your library" aria-label="Search titles" autocomplete="off"></label>
  <button id="toggleFilters" class="filterbtn" type="button" aria-expanded="false" aria-controls="filters"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span>Filters</span><b id="fcount" hidden></b></button>
</div>

<section id="filters" class="filters" hidden aria-label="Filters">
  <label>Sort by<select id="fSort"></select></label>
  <div class="field">Filter tags
    <button id="tagBtn" class="select" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="tagPicker"><span id="tagLabel">Any</span></button>
  </div>
  <label>Content rating<select id="fRating"><option value="">Any</option></select></label>
  <label>Magazine demographic<select id="fDemo"><option value="">Any</option></select></label>
  <label>Publication status<select id="fStatus"><option value="">Any</option></select></label>
  <label>Original language<select id="fLang"><option value="">Any</option></select></label>
  <div class="field">Publication year
    <div class="yrs"><input id="yFrom" type="number" min="1900" max="2100" inputmode="numeric" placeholder="From" aria-label="From year"><input id="yTo" type="number" min="1900" max="2100" inputmode="numeric" placeholder="To" aria-label="To year"></div>
  </div>
  <div class="actions">
    <button id="reset" class="danger" type="button">Reset filters</button>
    <button id="lucky" class="soft" type="button">Surprise me</button>
  </div>
</section>

<div id="tagPicker" class="picker" hidden role="dialog" aria-label="Filter tags"></div>

<div id="banner" class="banner" role="alert" hidden></div>
<p id="count" class="count" aria-live="polite">Loading…</p>
<main><div id="grid" class="grid posters" aria-busy="true"></div></main>

<div id="queuePanel" class="spanel qp" hidden role="dialog" aria-label="Download queue" tabindex="-1"></div>
<div id="settingsPanel" class="spanel" hidden role="dialog" aria-label="Settings" tabindex="-1"></div>

<div id="scrim" class="scrim" hidden></div>
<div id="detail" class="dialog" hidden role="dialog" aria-modal="true" aria-label="Series details"></div>

<div class="dock">
  <div class="pill" data-hide="1" aria-live="polite">
    <button id="qToggle" class="qstate" type="button" aria-expanded="false" aria-controls="queuePanel"></button>
    <button id="qAdd" class="add" type="button" hidden></button>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
